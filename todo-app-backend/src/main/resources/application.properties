spring.application.name=checklist
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.show-sql=true
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.refresh-token-secret-key=${JWT_REFRESH_TOKEN_SECRET_KEY}
security.jwt.remember-me-token-secret-key=${JWT_REMEMBER_ME_TOKEN_SECRET_KEY}
security.jwt.token-expiration-time=${JWT_TOKEN_EXPIRATION_TIME}
security.jwt.refresh-token-expiration-time=${JWT_REFRESH_TOKEN_EXPIRATION_TIME}
security.jwt.remember-me-token-expiration-time=${JWT_REMEMBER_ME_TOKEN_EXPIRATION_TIME}
security.redis.token-expiration-time=${REDIS_TOKEN_EXPIRATION_TIME}
management.server.port=8081
management.endpoints.web.exposure.include=*
security.aes.secret-key=${AES_SECRET_KEY}
spring.https=${IS_HTTPS}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.web.frontend-url=${FRONTEND_URL}
spring.kafka.bootstrap-servers=${KAFKA}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.flyway.baseline-on-migrate=true
spring.data.mongodb.uri=${MONGODB_CONNECTION_URL}